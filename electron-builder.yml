# electron-builder — produces the one artifact that matters: a Windows installer.
#
# There is no deploy in this project. "Release" means CastGood-Setup-<version>.exe
# exists. Per-user install, no admin rights, Start-menu shortcut.
#
# UNSIGNED, deliberately: see docs/DECISIONS.md "No code signing for v1". Windows
# SmartScreen warns once on first install. Do not add signing configuration here
# without a new ADR — it is a founder decision, not an implementation detail.

appId: xyz.ribenajuice.castgood
productName: CastGood
copyright: © CastGood

directories:
  output: dist/installer
  buildResources: build

# Only built output ships. Source, tests and the WSL scripts stay out of the app.
files:
  - dist/main/**/*
  - dist/renderer/**/*
  - package.json

asar: true
# Zero native modules by design (JSON files instead of SQLite, pure-JS mDNS), so
# there is nothing to rebuild — and nothing that can break across the WSL/Windows split.
npmRebuild: false

# --- Bundled ffmpeg ----------------------------------------------------------
# The founder installs nothing: pinned ffmpeg.exe/ffprobe.exe (build/ffmpeg-pin.json)
# are fetched and SHA-256 verified by scripts/fetch-ffmpeg.mjs, which `npm run build:win`
# runs before this. GPL v3, so their LICENSE text and the exact upstream commit ship
# beside them (2026-08-13 ADR).
#
# extraResources, NOT files: this copies to `resources/bin/` *beside* app.asar rather
# than into it. There is therefore nothing to `asarUnpack` — a binary inside an asar has
# no real path on disk and cannot be spawned, and the version that "works" is the one
# electron-builder silently unpacks to a cache directory. Outside is simpler and provable.
# `resources/bin` is gitignored and excluded from scripts/win-sync.sh; each side of the
# WSL/Windows split fetches its own copy rather than pushing 200 MB through rsync.
#
# src/engine/media/ffmpeg.ts looks for `<process.resourcesPath>/bin` — the `to:` below.
# test/architecture/ffmpeg-bundled.test.ts fails the build if these stop agreeing.
extraResources:
  - from: resources/bin
    to: bin
    filter:
      - ffmpeg.exe
      - ffprobe.exe
      - ffmpeg-build.json
      - LICENSE.ffmpeg.txt
      - BUILD.ffmpeg.txt

  # --- Licences ---------------------------------------------------------------
  # CastGood is MIT; the installer redistributes other people's code and both MIT and
  # BSD require the notice to travel with the binary. These sit beside the executable
  # rather than inside app.asar so somebody can actually read them without unpacking
  # an archive — which is the entire point of shipping them.
  #
  # THIRD-PARTY-NOTICES.txt is generated by scripts/generate-notices.mjs, which
  # `npm run build:win` runs before packaging so it can never drift behind a dependency
  # bump. ffmpeg's own GPL text is NOT in it and must not be: it ships unmodified in
  # bin/ above, next to the binary it covers.
  - from: LICENSE
    to: LICENSE.txt
  - from: THIRD-PARTY-NOTICES.txt
    to: THIRD-PARTY-NOTICES.txt
  # ----------------------------------------------------------------------------

# The guard that would have caught *Allow through the firewall* shipping broken: this runs
# inside the packaging step, after the app directory is laid out and before NSIS compresses
# it, and throws if ffmpeg.exe or ffprobe.exe is missing, truncated, or not the pinned
# build. An installer that silently shipped without an encoder would fail at the founder's
# first conversion with no diagnostic at all.
afterPack: ./scripts/verify-ffmpeg-packaged.cjs
# -----------------------------------------------------------------------------

win:
  target:
    - nsis
  artifactName: CastGood-Setup-${version}.${ext}
  # electron-builder generates the multi-size .ico from this. 512x512 is the size it
  # documents as the master; Windows' largest variant is 256, so a bigger source costs
  # megabytes and buys nothing. The canonical copy lives here in the repo, never in
  # C:\CastGood — that mirror is disposable and win-sync.sh deletes anything not in git.
  icon: build/icon.png

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: CastGood
  # The Windows Firewall rule (M1). Without an inbound rule for mDNS (UDP 5353)
  # and the media port, first launch shows a firewall prompt, and a dismissed
  # prompt means an app that finds nothing and cannot say why.
  #
  # build/installer.nsh adds a program-scoped, private-networks-only, LocalSubnet
  # rule on install and removes it on uninstall. Read the header of that file
  # before changing it: firewall rules are machine-wide, so the rule needs one
  # UAC consent, while the install itself stays per-user and never requires admin.
  # `CastGood-Setup.exe /NOFIREWALL` skips it entirely.
  include: build/installer.nsh
